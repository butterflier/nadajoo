<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>나다주앱</title>
<style>
  /*
   * Noto Sans KR. Noto Sans CJK KR 에서 한글만 떼어 낸 것이라 글자 모양은 같고,
   * 한자 2만 자가 빠져 훨씬 가볍다 (CJK OTF 한 벌 11MB → 한글 woff2 한 벌 530KB).
   *
   * 굵기는 400·500·700 세 벌만 싣는다. 600(소제목)은 700 이 받는다 — 한 벌을
   * 더 받자고 540KB 를 더 쓰는 것보다 낫다.
   *
   * 한글 쪽에는 unicode-range 를 두지 않아 기본이 되고, 라틴 쪽은 범위를 좁혀
   * 뒤에 선언한다. 숫자와 영문만 있는 글자는 13KB 짜리만 받아 가면 된다.
   */
  @font-face {
    font-family: "Noto Sans KR";
    src: url("/fonts/notosanskr-400-korean.woff2") format("woff2");
    font-weight: 400;
    font-style: normal;
    font-display: swap;
  }
  @font-face {
    font-family: "Noto Sans KR";
    src: url("/fonts/notosanskr-400-latin.woff2") format("woff2");
    font-weight: 400;
    font-style: normal;
    font-display: swap;
    unicode-range: U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD;
  }
  @font-face {
    font-family: "Noto Sans KR";
    src: url("/fonts/notosanskr-500-korean.woff2") format("woff2");
    font-weight: 500;
    font-style: normal;
    font-display: swap;
  }
  @font-face {
    font-family: "Noto Sans KR";
    src: url("/fonts/notosanskr-500-latin.woff2") format("woff2");
    font-weight: 500;
    font-style: normal;
    font-display: swap;
    unicode-range: U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD;
  }
  @font-face {
    font-family: "Noto Sans KR";
    src: url("/fonts/notosanskr-700-korean.woff2") format("woff2");
    font-weight: 600 700;
    font-style: normal;
    font-display: swap;
  }
  @font-face {
    font-family: "Noto Sans KR";
    src: url("/fonts/notosanskr-700-latin.woff2") format("woff2");
    font-weight: 600 700;
    font-style: normal;
    font-display: swap;
    unicode-range: U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD;
  }

  :root {
    --line: #DEE2E7;
    --line-w: 1.4px;
    --ink: #1B1D21;
    --ink-soft: #6B7280;
    --accent: #2F6FEB;
    --danger: #C2403C;
    --radius: 4px;
    --hour: 54px;
    --time-col: 58px;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: #FFFFFF;
    color: var(--ink);
    font-family: "Noto Sans KR", -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    font-weight: 400;
    -webkit-font-smoothing: antialiased;
  }

  .wrap { max-width: 1240px; margin: 0 auto; padding: 22px 18px 56px; }

  header.top {
    display: flex;
    align-items: baseline;
    flex-wrap: wrap;
    gap: 10px 14px;
    margin-bottom: 16px;
  }
  header.top h1 { font-size: 21px; font-weight: 700; margin: 0; letter-spacing: -0.2px; }
  .meta { font-size: 13px; color: var(--ink-soft); }

  .toolbar {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 14px;
  }
  .toolbar[hidden] { display: none; }
  .spacer { flex: 1 1 auto; }

  /* 탭/버튼: 개별 테두리 버튼 + 활성 시 accent 채움 */
  .btn {
    font-family: inherit;
    font-size: 13px;
    font-weight: 500;
    color: var(--ink);
    background: #FFFFFF;
    border: var(--line-w) solid var(--line);
    border-radius: var(--radius);
    padding: 7px 13px;
    cursor: pointer;
    line-height: 1.2;
  }
  .btn:hover { border-color: #C3C9D2; }
  .btn.is-active,
  .btn.primary {
    background: var(--accent);
    border-color: var(--accent);
    color: #FFFFFF;
  }
  .btn.danger { color: var(--danger); border-color: #E6C7C6; background: #FFFFFF; }
  .btn:disabled { opacity: 0.5; cursor: default; }

  .banner {
    border: var(--line-w) solid #E6D9B8;
    background: #FDFAF1;
    border-radius: var(--radius);
    padding: 9px 12px;
    font-size: 12.5px;
    line-height: 1.5;
    color: #7A5E1B;
    margin-bottom: 12px;
    display: flex;
    gap: 10px;
    align-items: flex-start;
  }
  .banner[hidden] { display: none; }
  .banner .close {
    border: none;
    background: none;
    font: inherit;
    color: inherit;
    cursor: pointer;
    padding: 0;
    opacity: 0.6;
  }

  .nav { display: flex; align-items: center; gap: 6px; }
  .nav .btn { padding: 7px 10px; }
  .nav-label {
    font-size: 13px;
    font-weight: 500;
    color: var(--ink-soft);
    margin-left: 4px;
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .picker { display: flex; gap: 6px; flex-wrap: wrap; min-width: 0; }
  /* 좁은 화면에서는 선생님을 단추 다섯이 아니라 고르는 칸 하나로 낸다 */
  .picker select {
    font-family: inherit;
    font-size: 14px;
    color: var(--ink);
    background: #FFFFFF;
    border: var(--line-w) solid var(--line);
    border-radius: var(--radius);
    padding: 8px 10px;
    max-width: 100%;
  }
  .picker select:focus { outline: none; border-color: var(--accent); }

  /* ── 격자 ─────────────────────────────────────── */
  .sheet {
    border: var(--line-w) solid var(--line);
    border-radius: var(--radius);
    overflow: auto;
    max-height: calc(100vh - 210px);
    background: #FFFFFF;
  }

  .grid {
    display: grid;
    grid-template-rows: auto auto;
    min-width: 840px;
  }

  .head {
    position: sticky;
    top: 0;
    z-index: 20;
    background: #FFFFFF;
    border-bottom: var(--line-w) solid var(--line);
    border-left: var(--line-w) solid var(--line);
    padding: 9px 8px;
    text-align: center;
    font-size: 13px;
    font-weight: 600;
  }
  .head .sub { display: block; font-size: 11px; font-weight: 400; color: var(--ink-soft); margin-top: 2px; }
  .head.weekend { color: var(--ink-soft); }
  .head.today { color: var(--accent); }
  /* 시간축 헤더(좌상단 모서리)는 가로·세로 양쪽 sticky라 가장 위 레이어 */
  .head.corner {
    left: 0;
    z-index: 40;
    border-left: none;
  }

  /* sticky 요소는 그 자체로 위치 기준이 되므로 .tick의 absolute가 여기에 걸린다.
     z-index는 수업 블록(10)보다 높아야 가로 스크롤 시 가려지지 않는다. */
  .timecol {
    position: sticky;
    left: 0;
    z-index: 30;
    background: #FFFFFF;
  }

  .tick {
    position: absolute;
    right: 7px;
    transform: translateY(-50%);
    font-size: 11px;
    color: var(--ink-soft);
    white-space: nowrap;
  }

  .col {
    position: relative;
    border-left: var(--line-w) solid var(--line);
    cursor: pointer;
    background-image:
      repeating-linear-gradient(
        to bottom,
        var(--line) 0,
        var(--line) var(--line-w),
        transparent var(--line-w),
        transparent var(--hour)
      ),
      repeating-linear-gradient(
        to bottom,
        #F1F3F5 0,
        #F1F3F5 1px,
        transparent 1px,
        transparent calc(var(--hour) / 2)
      );
    background-position: 0 0, 0 calc(var(--hour) / 2);
  }
  .col.weekend { background-color: #FBFBFC; }

  .lesson {
    position: absolute;
    z-index: 10;
    border: var(--line-w) solid;
    border-radius: var(--radius);
    padding: 3px 6px;
    overflow: hidden;
    cursor: pointer;
    font-size: 12px;
    line-height: 1.3;
    font-family: inherit;
    /* 블록이 수업 길이만큼 늘어나므로 글자는 가운데에 둔다 */
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
  }
  /* 3단 구조: [수업종류] 시간(작게) / 학생명(굵게) / 수업내용(작게) */
  .lesson .when,
  .lesson .t,
  .lesson .who {
    display: block;
    max-width: 100%;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .lesson .when { font-size: 11px; opacity: 0.78; line-height: 1.22; }
  .lesson .t { font-size: 13px; font-weight: 700; line-height: 1.3; margin: 1px 0; }
  .lesson .who { font-size: 11px; opacity: 0.78; line-height: 1.22; }

  /* 블록이 낮으면 아래부터 덜어낸다 */
  .lesson.short .who { display: none; }
  .lesson.tiny { padding: 1px 5px; }
  .lesson.tiny .who, .lesson.tiny .when { display: none; }
  .lesson.tiny .t { font-size: 12px; margin: 0; }

  /* 수업불가 — 수업이 아니라 바탕에 가깝게, 수업 블록보다 아래에 깐다 */
  .lesson.blocked { z-index: 5; }
  .lesson.blocked .t { font-weight: 600; font-size: 12px; }

  .empty {
    padding: 34px 16px;
    text-align: center;
    color: var(--ink-soft);
    font-size: 13px;
  }

  /* ── 학생 관리 ─────────────────────────────────── */
  .table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
  }
  .table th, .table td {
    border-bottom: var(--line-w) solid var(--line);
    padding: 9px 10px;
    text-align: left;
    vertical-align: middle;
  }
  .table th {
    font-size: 12px;
    font-weight: 500;
    color: var(--ink-soft);
    background: #FFFFFF;
    position: sticky;
    top: 0;
    z-index: 5;
  }
  .table td.num, .table th.num { text-align: right; font-variant-numeric: tabular-nums; }
  .table tbody tr { cursor: pointer; }
  .table tbody tr:hover { background: #F7F9FC; }
  .table .name { font-weight: 600; font-size: 14px; }
  .table .low { color: var(--danger); font-weight: 600; }
  .table .planned { color: var(--ink-soft); font-size: 12px; }

  /* ── 모달 ─────────────────────────────────────── */
  .scrim {
    position: fixed;
    inset: 0;
    background: rgba(27, 29, 33, 0.34);
    display: flex;
    align-items: flex-start;
    justify-content: center;
    padding: 36px 16px;
    overflow: auto;
    z-index: 100;
  }
  .scrim[hidden] { display: none; }

  .modal {
    background: #FFFFFF;
    border: var(--line-w) solid var(--line);
    border-radius: var(--radius);
    width: 100%;
    max-width: 460px;
    padding: 18px;
  }
  .modal h2 { margin: 0 0 14px; font-size: 16px; font-weight: 700; }
  .modal.narrow { max-width: 340px; }

  /* 세로로 쌓는 선택지 — 범위 고르기처럼 셋 중 하나일 때 */
  .stack { display: flex; flex-direction: column; gap: 6px; }
  .stack .btn { text-align: left; padding: 10px 13px; }

  /* 반복 묶음이라는 표시. 창 제목 바로 아래에 조용히 붙는다. */
  .series-note {
    margin: -6px 0 14px;
    padding: 7px 10px;
    border: var(--line-w) solid var(--line);
    border-radius: var(--radius);
    background: #F7F9FC;
  }
  .series-note[hidden] { display: none; }

  .field { margin-bottom: 12px; }
  .field label { display: block; font-size: 12px; font-weight: 500; color: var(--ink-soft); margin-bottom: 5px; }
  .field input[type="text"],
  .field input[type="tel"],
  .field input[type="time"],
  .field input[type="date"],
  .field input[type="number"],
  .field input[type="password"],
  .field select,
  .field textarea {
    width: 100%;
    font-family: inherit;
    font-size: 14px;
    color: var(--ink);
    background: #FFFFFF;
    border: var(--line-w) solid var(--line);
    border-radius: var(--radius);
    padding: 8px 10px;
  }
  .field textarea { resize: vertical; min-height: 58px; }
  .field input:focus, .field select:focus, .field textarea:focus { outline: none; border-color: var(--accent); }

  .row { display: flex; gap: 10px; }
  .row > .field { flex: 1 1 0; }

  .chips { display: flex; gap: 6px; flex-wrap: wrap; }
  .chips .btn { padding: 6px 12px; }

  .modal-actions { display: flex; gap: 8px; margin-top: 18px; align-items: center; }

  .msg { font-size: 12px; color: var(--danger); min-height: 16px; margin-top: 10px; }
  .msg.ok { color: var(--ink-soft); }

  .hint { font-size: 12px; color: var(--ink-soft); margin-top: 14px; line-height: 1.5; }
  .soft { font-weight: 400; color: var(--ink-soft); }

  /* 여러 명을 고르는 목록 — 학생이 늘어도 창이 길어지지 않게 스크롤한다 */
  .picklist {
    border: var(--line-w) solid var(--line);
    border-radius: var(--radius);
    margin-top: 6px;
    max-height: 148px;
    overflow: auto;
  }
  .picklist label.check { border-bottom: var(--line-w) solid var(--line); }
  .picklist label.check:last-child { border-bottom: none; }
  .picklist .none { padding: 10px; font-size: 12.5px; color: var(--ink-soft); }

  /* `.field label` 이 display:block 에 작은 회색 글씨라, 특이도를 올려서 되돌린다.
     label.check 로 안 쓰면 이 줄이 통째로 덮어씌워진다. */
  label.check {
    display: flex;
    align-items: center;
    gap: 8px;
    margin: 0;
    padding: 7px 10px;
    font-size: 13.5px;
    font-weight: 400;
    color: var(--ink);
    cursor: pointer;
  }
  label.check input { margin: 0; flex: none; accent-color: var(--accent); }
  label.check .who { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  /* 이름에서 20px 띄우고 작은 글씨로 (위 gap 8px + 여기 12px) */
  label.check .left {
    flex: none;
    margin-left: 12px;
    font-size: 11.5px;
    color: var(--ink-soft);
  }

  /* 온라인 표시 — 학생 이름 왼쪽에 붙는 작은 무선 기호 */
  .wifi { flex: none; vertical-align: -1px; margin-right: 3px; }

  /* 학생 창 안에 붙는 그 학생의 수업 목록 */
  .lesson-list { margin-top: 4px; border-top: var(--line-w) solid var(--line); }
  .lesson-list .item {
    display: flex;
    gap: 8px;
    align-items: baseline;
    padding: 7px 2px;
    border-bottom: var(--line-w) solid var(--line);
    font-size: 12.5px;
  }
  .lesson-list .item .d { color: var(--ink-soft); font-variant-numeric: tabular-nums; }
  .lesson-list .item .past { opacity: 0.55; }

  /* ── 잠금 화면 ─────────────────────────────────── */
  .lock { max-width: 320px; margin: 16vh auto 0; }
  .lock h1 { font-size: 20px; font-weight: 700; margin: 0 0 6px; }
  .lock p { font-size: 13px; color: var(--ink-soft); margin: 0 0 18px; line-height: 1.5; }

  /* PNG는 화면 밖 캔버스에 그린다 */
  #png-canvas { display: none; }

  /* ── 좁은 화면 ─────────────────────────────────
     주간 뷰는 하루씩만 그린다(app.js 의 weekDays). 여기서는 손가락으로 쓸 수
     있게 크기만 손본다 — 누르는 것은 최소 44px, 창은 화면을 꽉 채운다. */
  @media (max-width: 640px) {
    /* 가장자리에 붙지 않게 폭을 90%로 두고 가운데에 놓는다 */
    .wrap { width: 90%; max-width: none; margin: 0 auto; padding: 10px 0 28px; }

    /* 제목 줄을 한 줄로 눕히고 낮춘다 */
    header.top { margin-bottom: 8px; gap: 4px 8px; align-items: baseline; }
    header.top h1 { font-size: 17px; }
    .meta { font-size: 11.5px; }

    /* 화면 아래 안내는 감춘다 — 좁은 화면에서 두 줄을 먹는다 */
    .hint { display: none; }

    /* 무엇도 화면 밖으로 나가지 않게. 잘려 나간 단추는 없는 단추다. */
    html, body { overflow-x: hidden; }
    .wrap, .toolbar, .picker, .nav, .sheet { max-width: 100%; min-width: 0; }

    .toolbar { gap: 6px; margin-bottom: 10px; }
    .toolbar .spacer { display: none; }     /* 오른쪽으로 밀지 않는다 */
    .btn { padding: 11px 13px; font-size: 13.5px; min-height: 44px; }

    /* 탭과 동작 단추는 줄바꿈 대신 한 줄로 밀어 본다 — 세로를 아껴야 시간표가 보인다 */
    .toolbar.scroll {
      flex-wrap: nowrap;
      overflow-x: auto;
      scrollbar-width: none;
      -webkit-overflow-scrolling: touch;
    }
    .toolbar.scroll::-webkit-scrollbar { display: none; }
    .toolbar.scroll > * { flex: none; }
    /* 탭이 먼저, 그다음 가장 자주 누르는 수업 등록, 나머지는 밀어서 본다 */
    .toolbar.scroll #tabs { order: -2; flex-wrap: nowrap; }
    #btn-new-lesson { order: -1; }

    /* 선생님 고르기와 앞뒤 이동을 한 줄에 나눠 놓는다 */
    .picker { flex: 1 1 120px; }
    .picker select { width: 100%; min-height: 44px; font-size: 16px; }
    .nav { flex: none; gap: 4px; }
    .nav .btn { padding: 11px 12px; }
    /* 날짜는 격자 머리에 이미 있다. 여기서 또 적으면 한 줄을 헛되이 먹는다. */
    .nav-label { display: none; }

    /* 칸이 하나뿐이라 안에서 스크롤하지 않고 화면이 통째로 흐른다.
       그래야 요일 머리가 화면 맨 위에 붙어 따라온다(sticky 가 화면 기준이 된다). */
    .sheet { max-height: none; overflow: visible; }
    .grid { min-width: 0; }
    .head { padding: 8px 8px; font-size: 12.5px; }
    .head .sub { margin-top: 1px; }

    /* 시간축을 줄여 수업 칸에 폭을 넘기고, 한 시간의 높이도 낮춘다 */
    :root { --time-col: 42px; --hour: 46px; }
    .tick { right: 5px; font-size: 10.5px; }

    .lesson .when, .lesson .who { font-size: 11.5px; }
    .lesson .t { font-size: 14px; }

    /* 창은 화면을 꽉 채운다 — 작은 화면에서 떠 있는 상자는 답답하다 */
    .scrim { padding: 0; align-items: stretch; }
    .modal {
      max-width: none;
      min-height: 100%;
      border: none;
      border-radius: 0;
      padding: 18px 16px 28px;
    }
    .modal.narrow { max-width: none; }
    .row { flex-wrap: wrap; }
    .row > .field { flex: 1 1 140px; }
    .field input, .field select, .field textarea { font-size: 16px; min-height: 44px; }
    .field textarea { min-height: 76px; }
    label.check { padding: 11px 10px; min-height: 44px; }
    .picklist { max-height: 210px; }
    .modal-actions { position: sticky; bottom: 0; background: #FFFFFF; padding-top: 12px; }

    /* 학생 관리 표는 가로로 민다 */
    .table { min-width: 560px; }
  }
</style>
</head>
<body>

<div id="lock" class="wrap lock">
  <h1>나다주앱</h1>
  <p>학원 스케줄 관리. 학생 연락처가 들어 있어 조회에도 비밀번호가 필요합니다.</p>
  <form id="lock-form">
    <div class="field">
      <label for="lock-pw">공유 비밀번호</label>
      <input type="password" id="lock-pw" autocomplete="current-password" />
    </div>
    <button class="btn primary" type="submit" id="lock-btn">열기</button>
    <div class="msg" id="lock-msg"></div>
  </form>
</div>

<div id="app" class="wrap" hidden>
  <header class="top">
    <h1>나다주앱</h1>
    <span class="meta" id="meta"></span>
  </header>

  <div class="banner" id="banner" hidden>
    <span id="banner-text"></span>
    <span class="spacer"></span>
    <button class="close" type="button" id="banner-close">닫기</button>
  </div>

  <div class="toolbar scroll">
    <div class="picker" id="tabs">
      <button class="btn is-active" type="button" data-view="teacher">선생님별</button>
      <button class="btn" type="button" data-view="date">날짜별</button>
      <button class="btn" type="button" data-view="student">학생별</button>
      <button class="btn" type="button" data-view="students">학생 관리</button>
    </div>
    <span class="spacer"></span>
    <button class="btn" type="button" id="btn-refresh">새로고침</button>
    <button class="btn" type="button" id="btn-png">PNG 저장</button>
    <button class="btn" type="button" id="btn-new-student">학생 등록</button>
    <button class="btn" type="button" id="btn-new-block">수업불가 추가</button>
    <button class="btn primary" type="button" id="btn-new-lesson">수업 등록</button>
  </div>

  <div class="toolbar" id="bar-teacher">
    <div class="picker" id="teachers"></div>
    <span class="spacer"></span>
    <div class="nav">
      <button class="btn" type="button" id="wk-prev">&lsaquo;</button>
      <button class="btn" type="button" id="wk-today">이번 주</button>
      <button class="btn" type="button" id="wk-next">&rsaquo;</button>
      <span class="nav-label" id="wk-label"></span>
    </div>
  </div>

  <div class="toolbar" id="bar-student" hidden>
    <div class="field" style="margin: 0; min-width: 200px;">
      <select id="pick-student"></select>
    </div>
    <span class="meta" id="student-balance"></span>
    <span class="spacer"></span>
    <div class="nav">
      <button class="btn" type="button" id="sw-prev">&lsaquo;</button>
      <button class="btn" type="button" id="sw-today">이번 주</button>
      <button class="btn" type="button" id="sw-next">&rsaquo;</button>
      <span class="nav-label" id="sw-label"></span>
    </div>
  </div>

  <div class="toolbar" id="bar-date" hidden>
    <div class="nav">
      <button class="btn" type="button" id="dy-prev">&lsaquo;</button>
      <button class="btn" type="button" id="dy-today">오늘</button>
      <button class="btn" type="button" id="dy-next">&rsaquo;</button>
      <span class="nav-label" id="dy-label"></span>
    </div>
  </div>

  <div class="sheet" id="sheet"></div>

  <p class="hint" id="hint"></p>
</div>

<div class="scrim" id="scrim-lesson" hidden>
  <form class="modal" id="form-lesson">
    <h2 id="lesson-title">수업 등록</h2>
    <p class="hint series-note" id="lesson-series" hidden></p>

    <div class="row">
      <div class="field">
        <label for="f-teacher">선생님</label>
        <select id="f-teacher"></select>
      </div>
      <div class="field">
        <label>온라인 수업</label>
        <label class="check">
          <input type="checkbox" id="f-online" />
          <span>온라인으로 진행</span>
        </label>
      </div>
    </div>

    <div class="field">
      <label for="f-student-filter">학생 <span class="soft" id="f-student-count"></span></label>
      <input type="text" id="f-student-filter" autocomplete="off" placeholder="이름으로 찾기" />
      <div class="picklist" id="f-students"></div>
    </div>

    <div class="field">
      <label>수업종류</label>
      <div class="chips" id="f-kinds"></div>
    </div>

    <div class="field">
      <label for="f-content">수업내용</label>
      <input type="text" id="f-content" autocomplete="off" placeholder="예: 게이오대학 본고사" />
    </div>

    <div class="row">
      <div class="field">
        <label for="f-date">날짜</label>
        <input type="date" id="f-date" />
      </div>
      <div class="field">
        <label for="f-start">시작</label>
        <input type="time" id="f-start" step="300" />
      </div>
      <div class="field">
        <label for="f-end">종료 <span class="soft">자정은 00:00</span></label>
        <input type="time" id="f-end" step="300" />
      </div>
    </div>

    <div class="field">
      <label for="f-repeat">이 수업을 몇 주 반복할까요</label>
      <select id="f-repeat">
        <option value="1">반복 없이 이 날만</option>
        <option value="2">2주</option>
        <option value="4">4주</option>
        <option value="8">8주</option>
        <option value="12">12주</option>
      </select>
    </div>

    <div class="field">
      <label for="f-memo">메모</label>
      <textarea id="f-memo"></textarea>
    </div>

    <div class="modal-actions">
      <button class="btn primary" type="submit" id="btn-save">저장</button>
      <button class="btn danger" type="button" id="btn-delete" hidden>삭제</button>
      <span class="spacer"></span>
      <button class="btn" type="button" id="btn-cancel">닫기</button>
    </div>
    <div class="msg" id="lesson-msg"></div>
  </form>
</div>

<div class="scrim" id="scrim-scope" hidden>
  <div class="modal narrow">
    <h2 id="scope-title">반복 수업</h2>
    <p class="hint" id="scope-text" style="margin-top: 0;"></p>
    <div class="stack">
      <button class="btn" type="button" data-scope="one">이 수업만</button>
      <button class="btn" type="button" data-scope="after">이 날 이후 전부</button>
      <button class="btn" type="button" data-scope="all">묶음 전부</button>
    </div>
    <div class="modal-actions">
      <span class="spacer"></span>
      <button class="btn" type="button" id="scope-cancel">취소</button>
    </div>
  </div>
</div>

<div class="scrim" id="scrim-block" hidden>
  <form class="modal" id="form-block">
    <h2 id="block-title">수업불가 추가</h2>
    <p class="hint series-note" id="block-series" hidden></p>
    <p class="hint" style="margin-top: 0;">정규수업·휴가·연휴처럼 개인수업을 넣을 수 없는 시간입니다. 학생이 없으니 잔여 시간은 깎이지 않습니다.</p>

    <div class="row">
      <div class="field">
        <label for="b-teacher">선생님</label>
        <select id="b-teacher"></select>
      </div>
      <div class="field">
        <label for="b-title">사유</label>
        <input type="text" id="b-title" autocomplete="off" placeholder="예: 정규수업, 휴가" />
      </div>
    </div>

    <div class="row">
      <div class="field">
        <label for="b-date">날짜</label>
        <input type="date" id="b-date" />
      </div>
      <div class="field">
        <label for="b-start">시작</label>
        <input type="time" id="b-start" step="300" />
      </div>
      <div class="field">
        <label for="b-end">종료 <span class="soft">자정은 00:00</span></label>
        <input type="time" id="b-end" step="300" />
      </div>
    </div>

    <div class="field">
      <label for="b-student-filter">학생 <span class="soft">— 학생 쪽 수업불가면 고르세요 (비우면 학생을 가리지 않습니다)</span></label>
      <input type="text" id="b-student-filter" autocomplete="off" placeholder="이름으로 찾기" />
      <div class="picklist" id="b-students"></div>
    </div>

    <div class="field" id="b-repeat-field">
      <label for="b-repeat">몇 주 반복할까요</label>
      <select id="b-repeat">
        <option value="1">반복 없이 이 날만</option>
        <option value="2">2주</option>
        <option value="4">4주</option>
        <option value="8">8주</option>
        <option value="12">12주</option>
      </select>
    </div>

    <div class="field">
      <label for="b-memo">메모</label>
      <textarea id="b-memo"></textarea>
    </div>

    <div class="modal-actions">
      <button class="btn primary" type="submit" id="b-save">저장</button>
      <button class="btn danger" type="button" id="b-delete" hidden>삭제</button>
      <span class="spacer"></span>
      <button class="btn" type="button" id="b-cancel">닫기</button>
    </div>
    <div class="msg" id="block-msg"></div>
  </form>
</div>

<div class="scrim" id="scrim-student" hidden>
  <form class="modal" id="form-student">
    <h2 id="student-title">학생 등록</h2>

    <div class="field">
      <label for="s-name">이름</label>
      <input type="text" id="s-name" autocomplete="off" />
    </div>

    <div class="row">
      <div class="field">
        <label for="s-contact">연락처</label>
        <input type="tel" id="s-contact" autocomplete="off" />
      </div>
      <div class="field">
        <label for="s-hours">총 시간 (시간)</label>
        <input type="number" id="s-hours" step="0.5" min="0" />
      </div>
    </div>

    <div class="field">
      <label for="s-memo">메모</label>
      <textarea id="s-memo"></textarea>
    </div>

    <div id="s-balance" class="hint"></div>
    <div class="lesson-list" id="s-lessons"></div>

    <div class="modal-actions">
      <button class="btn primary" type="submit" id="s-save">저장</button>
      <button class="btn danger" type="button" id="s-delete" hidden>삭제</button>
      <span class="spacer"></span>
      <button class="btn" type="button" id="s-cancel">닫기</button>
    </div>
    <div class="msg" id="student-msg"></div>
  </form>
</div>

<canvas id="png-canvas"></canvas>

<script src="/app.js"></script>
<script src="/png.js"></script>
</body>
</html>
